[package]
name = "ccp-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Standalone receipt verifier for Commit CI Preflight."
license = "Apache-2.0"

[dependencies]
ccp-core = { path = "../ccp-core" }
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }

[dev-dependencies]
serde_json = "1.0.151"
