[package]
name = "commit-ci-preflight"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Run reproducible local CI preflights and emit verifiable evidence before remote CI."
license = "Apache-2.0"
repository = "https://github.com/MarcoPorcellato/commit-ci-preflight"
readme = "README.md"
keywords = ["ci", "preflight", "containers", "evidence", "github-actions"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
process-wrap = { version = "=9.1.0", default-features = false, features = ["job-object", "process-group", "std"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
saphyr = { version = "0.0.6", default-features = false }
saphyr-parser = { version = "0.0.6", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.1", default-features = false, features = ["process", "signal"] }
