name: Commit CI Preflight

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: commit-ci-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CCP_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
  CCP_STATUS_CONTEXT: commit-ci-preflight/receipt

jobs:
  receipt:
    name: Verify local receipt
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publish pending status on the exact pull-request commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CCP_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CCP_EXPECTED_COMMIT}" \
            -f state=pending \
            -f context="$CCP_STATUS_CONTEXT" \
            -f description="Local receipt verification started" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Check out the trusted base revision
        id: trusted
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Retrieve the commit-bound evidence branch
        id: evidence
        if: steps.trusted.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ccp-evidence/${{ github.event.pull_request.head.sha }}
          path: evidence
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            .ccp/receipt.json
          sparse-checkout-cone-mode: false

      - name: Build the trusted Rust verifier only
        id: build
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        working-directory: trusted
        run: cargo build --locked --release --bin commit-ci-preflight

      - name: Verify receipt integrity and repository policy
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: trusted
        run: |
          scripts/github-receipt-gate.sh \
            target/release/commit-ci-preflight \
            ../evidence/.ccp/receipt.json \
            .commit-ci-policy.toml \
            "$CCP_EXPECTED_COMMIT"

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Receipt missing or verification failed"
          if [[ "$TRUSTED_OUTCOME" == "success" &&
                "$EVIDENCE_OUTCOME" == "success" &&
                "$BUILD_OUTCOME" == "success" &&
                "$VERIFY_OUTCOME" == "success" ]]; then
            state=success
            description="Commit-bound local receipt accepted"
          elif [[ "$VERIFY_OUTCOME" != "failure" ]]; then
            {
              echo "### Commit CI Preflight"
              echo
              echo "FAIL: trusted verifier build or evidence retrieval did not complete."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Commit CI Preflight::Receipt retrieval or trusted verifier build failed; see the job summary."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CCP_EXPECTED_COMMIT}" \
            -f state="$state" \
            -f context="$CCP_STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          [[ "$state" == "success" ]]
