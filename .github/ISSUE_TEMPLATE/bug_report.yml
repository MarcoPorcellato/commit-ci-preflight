name: "Bug report"
description: "Report incorrect behavior or trust-boundary gaps in Commit CI Preflight."
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue.

        Commit CI Preflight currently provides A0 integrity and policy evidence.
        If you are reporting a claim outside that boundary, include the exact
        gap in your report.

  - type: dropdown
    id: trust_layer
    attributes:
      label: Affected trust layer
      description: Select the assurance layer that this issue impacts.
      options:
        - "A0: receipt integrity and repository-policy checks"
        - "A1: identity-linked assertion"
        - "A2: managed device assertion"
        - "A3: execution attestation"
        - "Crossing layers or unknown"
      default: 0
    validations:
      required: true

  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior
      description: What happened, including command output snippets if available.
      placeholder: |
        Example:
        `commit-ci-preflight run` produced no PASS on a clean main branch.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Platform and version
      description: Operating system and project type (Rust, Python, Node).
      placeholder: "macOS arm64 / Rust"
    validations:
      required: true

  - type: checkboxes
    id: report_boundaries
    attributes:
      label: Trust-boundary hygiene
      description: Confirm these are true before we can assess the report.
      options:
        - label: "I did not include secrets, private artifacts, or personal data."
          required: true
        - label: "I can reproduce this on a reviewed branch with clean state."
        - label: "If the issue mentions false claims (for example 'eliminates remote CI' or 'zero trust risk'), I marked them above and included proof."
          required: true

  - type: textarea
    id: references
    attributes:
      label: Documentation links (required)
      description: Add one or more references to current docs or guides that conflict.
      value: |
        - [docs/ADOPTION_GUIDE.md](docs/ADOPTION_GUIDE.md)
        - [docs/RECEIPT_SPEC.md](docs/RECEIPT_SPEC.md)
