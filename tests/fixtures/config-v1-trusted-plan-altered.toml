schema_version = "1.0"
project = "example/project"

[runtime]
kind = "docker_compatible"
image = "example.invalid/ci@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
cpu_count = 1
memory_mib = 128
pids_limit = 16
network = false

[receipt]
output = ".ccp/receipt.json"
freshness_seconds = 86400

[[checks]]
id = "rust-test"
required = true
argv = ["cargo", "test", "--release"]
working_directory = "."
timeout_seconds = 60
