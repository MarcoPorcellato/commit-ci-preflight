schema_version = "1.1"
project = "MarcoPorcellato/commit-ci-preflight"

[runtime]
kind = "docker_compatible"
image = "docker.io/library/rust@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc"
cpu_count = 4
memory_mib = 4096
pids_limit = 512
network = true

[receipt]
output = ".ccp/receipt.json"
freshness_seconds = 86400

[[environment.runtime_internal]]
name = "CARGO_HOME"
cache_id = "cargo-home"

[[environment.runtime_internal]]
name = "CARGO_TARGET_DIR"
cache_id = "cargo-target"

[[environment.runtime_internal]]
name = "RUSTUP_HOME"
cache_id = "rustup-home"

[[caches]]
id = "cargo-home"
mount_path = ".ccp-mounts/cargo-home"

[[caches]]
id = "cargo-target"
mount_path = ".ccp-mounts/cargo-target"

[[caches]]
id = "rustup-home"
mount_path = ".ccp-mounts/rustup-home"

[[caches]]
id = "test-work"
mount_path = ".ccp-mounts/test-work"

[[checks]]
id = "format"
required = true
argv = ["cargo", "fmt", "--all", "--", "--check"]
working_directory = "."
timeout_seconds = 900

[[checks]]
id = "test"
required = true
argv = ["env", "CCP_TEST_ROOT=/workspace/.ccp-mounts/test-work", "cargo", "test", "--locked", "--all-targets", "--all-features"]
working_directory = "."
timeout_seconds = 900
depends_on = ["format"]

[[checks]]
id = "clippy"
required = true
argv = ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"]
working_directory = "."
timeout_seconds = 900
depends_on = ["test"]

[[checks]]
id = "docs"
required = true
argv = ["cargo", "doc", "--locked", "--no-deps"]
working_directory = "."
timeout_seconds = 600
depends_on = ["clippy"]

[[checks]]
id = "release-metadata"
required = true
argv = ["cargo", "run", "--locked", "--quiet", "--example", "generate_release_metadata", "--", "--check"]
working_directory = "."
timeout_seconds = 300
depends_on = ["docs"]
